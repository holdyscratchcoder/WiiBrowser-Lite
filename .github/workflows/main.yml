name: Build Wii Homebrew

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Switch to the dedicated PPC container
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pacman update step is removed because wii-dev tools are already baked into this image

      # devkitppc container sets up the variables automatically, so you just call make
      - name: Build project
        run: |
          make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wii-homebrew-boot-dol
          path: |
            *.dol
            *.elf
            apps/
            
